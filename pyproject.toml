[project]
name = "variantscribe"
version = "0.1.0"
description = "Agentic clinical variant interpretation copilot — drafts ACMG/AMP classifications with cited evidence, evaluated against ClinVar gold labels."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Eduardo Ramos Alves", email = "eduramosalves@gmail.com" }]
keywords = ["genomics", "acmg", "clinvar", "rag", "llm", "bioinformatics"]

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "tenacity>=8.4",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
# File-based vector store. No torch — the pipeline runs with the dependency-free
# HashingEmbedder, so retrieval is fully testable without a GPU stack.
retrieval = [
    "lancedb>=0.13",
    "numpy>=1.26",
]
# MedCPT encoders + cross-encoder (pulls torch). The production retrieval quality.
medcpt = [
    "transformers>=4.40",
    "torch>=2.2",
]
# LLM agent.
agent = [
    "anthropic>=0.34",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
variantscribe = "variantscribe.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/variantscribe"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
