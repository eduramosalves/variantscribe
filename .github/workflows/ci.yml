name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: lint + tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      # No torch / no API key needed: the hashing embedder and a mocked Anthropic
      # client cover the retrieval pipeline and the classifier in tests.
      - name: Sync dependencies
        run: uv sync --extra dev --extra retrieval --extra agent --python ${{ matrix.python-version }}

      - name: Ruff (lint)
        run: uv run ruff check src tests scripts

      - name: Pytest
        run: uv run pytest -q

  eval-gate:
    name: eval regression gate
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Sync (base only)
        run: uv sync

      # Runs the real eval pipeline against a committed fixture and fails the build
      # if macro-F1 / accuracy drift from pinned expectations.
      - name: Eval gate
        run: uv run python scripts/eval_gate.py
